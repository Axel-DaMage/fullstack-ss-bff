spring.application.name=bff
server.port=${PORT:8081}

spring.cloud.loadbalancer.retry.enabled=true

pet.service.url=${PET_SERVICE_URL:http://pet-service}
location.service.url=${LOCATION_SERVICE_URL:http://geo-service}
match.service.url=${MATCH_SERVICE_URL:http://match-service}

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.preferIpAddress=true
eureka.instance.leaseRenewalIntervalInSeconds=5
eureka.instance.leaseExpirationDurationInSeconds=15
eureka.client.initialInstanceInfoReplicationIntervalSeconds=5

logging.level.com.sanosysalvos=INFO
logging.level.org.springframework.web=INFO